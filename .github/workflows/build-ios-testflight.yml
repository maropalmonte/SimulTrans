name: iOS TestFlight

# Se lanza a mano (Actions > "iOS TestFlight" > Run workflow). Firma con
# firma automática usando una clave de la API de App Store Connect y sube
# el .ipa a TestFlight. Requiere cuenta de pago del Apple Developer Program
# y estos Repository Secrets:
#   APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8 (contenido del .p8),
#   APPLE_TEAM_ID
on:
  workflow_dispatch:
    inputs:
      buildNumber:
        description: 'Número de build (entero, mayor que el anterior subido)'
        required: true
      versionName:
        description: 'Versión visible (ej. 1.0)'
        required: true
        default: '1.0'

jobs:
  testflight:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos
        run: |
          fallo=0
          for v in KEY_ID ISSUER_ID TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secreto asociado a $v"; fallo=1; fi
          done
          if [ -z "${{ secrets.APPSTORE_KEY_P8 }}" ]; then echo "::error::Falta APPSTORE_KEY_P8"; fallo=1; fi
          [ "$fallo" = 1 ] && exit 1 || true

      - name: Git LFS sin descargas innecesarias
        run: |
          brew install git-lfs || true
          git lfs install --skip-smudge

      - name: Instalar XcodeGen y generar proyecto
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Guardar la clave de App Store Connect
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPSTORE_KEY_P8 }}" > ~/private_keys/AuthKey_${KEY_ID}.p8

      - name: Comprobar el formato de la clave de App Store Connect
        run: |
          f=~/private_keys/AuthKey_${KEY_ID}.p8
          echo "Longitud del Key ID: ${#KEY_ID} (debe ser 10)"
          if ! [[ "$ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then echo "::error::APPSTORE_ISSUER_ID no tiene formato de UUID (8-4-4-4-12 caracteres, con guiones, ${#ISSUER_ID} caracteres recibidos)"; exit 1; fi
          echo "Issuer ID con formato correcto"
          echo "Líneas del .p8: $(wc -l < $f) (debe ser 4-5)"
          echo "Primera línea: $(head -1 $f)"
          echo "Última línea: $(tail -1 $f)"
          if openssl pkcs8 -in $f -nocrypt -topk8 -out /dev/null 2>/dev/null; then echo "La clave .p8 es válida"; else echo "::error::El contenido de APPSTORE_KEY_P8 NO es una clave .p8 válida (revisa que esté completo, con las líneas BEGIN y END)"; exit 1; fi
          if [ ${#KEY_ID} -ne 10 ]; then echo "::error::APPSTORE_KEY_ID debe tener 10 caracteres"; exit 1; fi

      - name: Probar la clave directamente contra la API de App Store Connect
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography 2>&1 | tail -1
          python3 - <<'PY'
          import os, time, json, urllib.request, urllib.error, jwt
          kid = os.environ["KEY_ID"].strip(); iss = os.environ["ISSUER_ID"].strip()
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{os.environ['KEY_ID']}.p8")).read()
          def probar(con_issuer):
              claims = {"aud": "appstoreconnect-v1", "exp": int(time.time()) + 600}
              if con_issuer: claims["iss"] = iss
              else: claims["sub"] = "user"
              tok = jwt.encode(claims, key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
              req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=50", headers={"Authorization": f"Bearer {tok}"})
              try:
                  r = json.load(urllib.request.urlopen(req))
                  return 200, [a["attributes"]["bundleId"] for a in r.get("data", [])]
              except urllib.error.HTTPError as e:
                  try: d = json.load(e); m = [x.get("detail") or x.get("title") for x in d.get("errors", [])]
                  except Exception: m = [str(e)]
                  return e.code, m
          c, r = probar(True)
          print("Clave de EQUIPO (con Issuer):", c, r)
          if c != 200:
              c2, r2 = probar(False)
              print("Clave INDIVIDUAL (sin Issuer):", c2, r2)
              if c2 == 200:
                  print("::error::La clave es INDIVIDUAL. Crea una clave en la pestaña 'Claves de equipo' (Team Keys) con acceso Administrador.")
              else:
                  print(f"::error::Apple rechaza la clave ({c}): {r}")
              raise SystemExit(1)
          print("Apps visibles con esta clave:", r)
          if "es.maropal.simultrans" not in r:
              print("::error::La clave funciona, pero la app es.maropal.simultrans NO existe en App Store Connect (paso 2).")
              raise SystemExit(1)
          PY

      - name: Archivar sin firmar (la firma de distribución se hace al exportar)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SimulTransIOS.xcodeproj \
            -scheme SimulTransIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/SimulTrans.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=$TEAM_ID \
            MARKETING_VERSION=${{ inputs.versionName }} \
            CURRENT_PROJECT_VERSION=${{ inputs.buildNumber }} 2>&1 | tee $RUNNER_TEMP/archive.log \
            || { grep -E "error:|error " $RUNNER_TEMP/archive.log | sort -u | head -15 | while read -r l; do echo "::error::${l:0:900}"; done; exit 1; }

      - name: Exportar el .ipa firmado para distribución
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/SimulTrans.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tee $RUNNER_TEMP/export.log \
            || { grep -E "error:|error |rror Domain" $RUNNER_TEMP/export.log | sort -u | head -15 | while read -r l; do echo "::error::${l:0:900}"; done; exit 1; }
          ls -la $RUNNER_TEMP/export

      - name: Subir a TestFlight con altool
        run: |
          IPA=$(ls $RUNNER_TEMP/export/*.ipa | head -1)
          echo "Subiendo $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" 2>&1 | tee $RUNNER_TEMP/upload.log \
            || { grep -iE "error|fail|ERROR ITMS" $RUNNER_TEMP/upload.log | head -15 | while read -r l; do echo "::error::${l:0:900}"; done; exit 1; }
