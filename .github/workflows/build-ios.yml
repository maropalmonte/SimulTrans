name: Build iOS (Simulator)
# Compila la app iOS para el Simulador, sin necesidad de firma de Apple.
# Es el "paso 1": comprobar que todo el engranaje (XcodeGen + Xcode en la
# nube) funciona antes de meternos con firmar para un iPhone real.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Git LFS, omitiendo la descarga de binarios no necesarios
        run: |
          brew install git-lfs || true
          git lfs install --skip-smudge

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto Xcode a partir de project.yml
        run: xcodegen generate

      - name: Compilar para el Simulador de iOS (sin firma)
        run: |
          set -o pipefail
          xcodebuild -project SimulTransIOS.xcodeproj \
            -scheme SimulTransIOS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            build 2>&1 | tee build.log || {
              # Publica los errores de Swift como avisos visibles en la pestaña del job.
              grep -E "error:" build.log | sort -u | head -25 | while IFS= read -r linea; do
                echo "::error::${linea}"
              done
              exit 1
            }
