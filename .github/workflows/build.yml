name: Build APK

# Se ejecuta al hacer push a main/master o manualmente desde la pestaña Actions
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
        # Este proyecto no incluye el "gradle wrapper" (gradlew), así que
        # usamos Gradle instalado directamente por esta acción en el runner.

      - name: Compilar APK de depuración
        run: gradle assembleDebug
        env:
          LANG: es_ES.UTF-8
          LC_ALL: es_ES.UTF-8
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SimulTrans-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
