name: SimulTransIOS
options:
  bundleIdPrefix: es.maropal
packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    from: 0.12.0
targets:
  SimulTransIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SimulTrans
        UILaunchScreen: {}
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "SimulTrans necesita el micrófono para traducir tu voz."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.maropal.simultrans
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
