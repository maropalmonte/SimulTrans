name: SimulTransIOS
options:
  bundleIdPrefix: com.example
packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    from: 0.12.0
targets:
  SimulTransIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SimulTrans
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "SimulTrans necesita el micrófono para traducir tu voz."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.simultransios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
